<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity Web Player | wabar</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
  </head>
  <body>
    <div id="unity-container" class="unity-desktop">
      <canvas id="unity-canvas" width="960" height="600" tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-warning"></div>
      <div id="unity-footer">
        <div id="unity-logo-title-footer"></div>
        <div id="unity-fullscreen-button"></div>
        <div id="unity-build-title">wabar</div>
      </div>
    </div>

    <!-- Unity初期化スクリプト -->
    <script>
      var canvas = document.querySelector("#unity-canvas");

      // 警告・エラーメッセージ用のバナー表示関数
      function unityShowBanner(msg, type) {
        var warningBanner = document.querySelector("#unity-warning");
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        
        if (type == 'error') {
          div.style = 'background: red; padding: 10px;';
        } else {
          if (type == 'warning') {
            div.style = 'background: yellow; padding: 10px;';
          }
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/docs.loader.js";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/docs.data.unityweb",
        frameworkUrl: buildUrl + "/docs.framework.js.unityweb",
        codeUrl: buildUrl + "/docs.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "wabar",
        productVersion: "1.0",
        showBanner: unityShowBanner,
        webglContextAttributes: { alpha: true, premultipliedAlpha: false },
      };

      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        // モバイル端末向け設定
        var meta = document.createElement('meta');
        meta.name = 'viewport';
        meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
        document.getElementsByTagName('head')[0].appendChild(meta);
        document.querySelector("#unity-container").className = "unity-mobile";
        canvas.className = "unity-mobile";
      } else {
        // デスクトップ向け設定
        canvas.style.width = "960px";
        canvas.style.height = "600px";
      }

      document.querySelector("#unity-loading-bar").style.display = "block";

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          document.querySelector("#unity-progress-bar-full").style.width = 100 * progress + "%";
        }).then((unityInstance) => {
          document.querySelector("#unity-loading-bar").style.display = "none";
          document.querySelector("#unity-fullscreen-button").onclick = () => {
            unityInstance.SetFullscreen(1);
          };

          // ==========================================
          // Unity初期化完了後に実行（ご指定のコード）
          // ==========================================
          const gl = document.getElementById("unity-canvas").getContext("webgl2") || document.getElementById("unity-canvas").getContext("webgl");
          if (gl) {
            console.log("WebGL Context Attributes:", gl.getContextAttributes());
          } else {
            console.log("WebGL context could not be acquired.");
          }

        }).catch((message) => {
          alert(message);
        });
      };

      document.body.appendChild(script);
    </script>

    <!-- WebAR起動関数 -->
    <script>
      window.webARStart = async function () {
        console.log("webARStart called");
        try {
          // 背面カメラを起動
          const stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: "environment" },
            audio: false
          });

          // カメラ映像をページ全体の固定背景にする
          let video = document.getElementById("ar-video");
          if (!video) {
            video = document.createElement("video");
            video.id = "ar-video";
            video.setAttribute("playsinline", "");
            video.muted = true;
            video.style.cssText =
              "position:fixed; left:0; top:0; width:100vw; height:100vh; object-fit:cover; z-index:0;";
            document.body.insertBefore(video, document.body.firstChild);
          }
          video.srcObject = stream;
          await video.play();

          // Unityのコンテナとcanvasを全画面・透明にして前面に出す
          const container = document.getElementById("unity-container");
          const canvas = document.getElementById("unity-canvas");

          container.style.cssText =
            "position:fixed; left:0; top:0; width:100vw; height:100vh; transform:none; background:transparent; z-index:1;";
          canvas.style.cssText =
            "position:absolute; left:0; top:0; width:100vw; height:100vh; background:transparent; z-index:1;";
          document.body.style.background = "transparent";

          // フッター（Unityロゴ・全画面ボタン）を非表示にする
          const footer = document.getElementById("unity-footer");
          if (footer) {
            footer.style.display = "none";
          }

          console.log("AR camera started");
        } catch (e) {
          console.error("カメラ起動に失敗:", e);
          alert("カメラを起動できませんでした: " + e.message);
        }
      };
    </script>
  </body>
</html>
